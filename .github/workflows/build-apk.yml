name: Build APK

on:
  push:
    branches: [ no-long-press-reset ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore source book
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets /tmp/previous-apk
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/norhussein535-cmd/azkar-app/actions/artifacts/9249829626/zip' \
            -o /tmp/previous.zip
          unzip -o /tmp/previous.zip -d /tmp/previous-apk
          unzip -p /tmp/previous-apk/app-debug.apk assets/book.pdf > app/src/main/assets/book.pdf
          test -s app/src/main/assets/book.pdf
          file app/src/main/assets/book.pdf | grep -i PDF
      - name: Generate native adhkar content and counters
        run: |
          python -m pip install --quiet PyMuPDF==1.26.3
          python tools/generate_content.py
          test -s app/src/main/assets/content.json
      - name: Make long press count once on release
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/azkar/book/DetailActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('اضغط على نص الذكر نفسه ليزيد العداد • عند اكتمال العدد سيهتز الهاتف • ضغط مطوّل على العداد للتصفير','اضغط أو اضغط مطولًا على نص الذكر؛ تُحسب مرة واحدة عند رفع إصبعك • عند اكتمال العدد سيهتز الهاتف')
          s=s.replace('body.setOnClickListener(v->incrementFromBody(card,counters,tid,bi,ei,body));','body.setLongClickable(false);\n            body.setOnClickListener(v->incrementFromBody(card,counters,tid,bi,ei,body));')
          s=s.replace('else Toast.makeText(this,"اكتمل العدد — اضغط مطولا للتصفير",Toast.LENGTH_SHORT).show();','else Toast.makeText(this,"اكتمل العدد",Toast.LENGTH_SHORT).show();')
          old='count.setOnLongClickListener(v->{prefs.edit().putInt(key,0).apply();updateCounterButton(count,key,target);Toast.makeText(this,"تم تصفير العداد",Toast.LENGTH_SHORT).show();return true;});'
          new='count.setLongClickable(false);'
          if old not in s:
              raise SystemExit('Expected reset handler not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          assert 'تم تصفير العداد' not in s
          assert 'putInt(key,0)' not in s
          assert 'setLongClickable(false)' in s
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: azkar-app-long-press-counts
          path: app/build/outputs/apk/debug/app-debug.apk
