name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download bundled PDF
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 'https://drive.google.com/uc?export=download&id=1bM4CoKMHf2s2QtTqabDzjGhwU4orAkfz' -o app/src/main/assets/book.pdf
          test -s app/src/main/assets/book.pdf
          file app/src/main/assets/book.pdf
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: azkar-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
